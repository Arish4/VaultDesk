# docker compose up --build   →   app on http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaultdesk
      POSTGRES_USER: vaultdesk
      POSTGRES_PASSWORD: vaultdesk
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultdesk"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgres://vaultdesk:vaultdesk@db:5432/vaultdesk
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: local-docker-secret-key-change-me-please
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    environment: *backend-env
    command: celery -A config worker --loglevel=info
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
