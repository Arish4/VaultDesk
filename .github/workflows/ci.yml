name: CI

# Runs on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vaultdesk
          POSTGRES_USER: vaultdesk
          POSTGRES_PASSWORD: vaultdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultdesk"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vaultdesk:vaultdesk@localhost:5432/vaultdesk
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Fail if a model change has no migration
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests on PostgreSQL
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
